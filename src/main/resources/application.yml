server:
  port: ${PORT:8095}
  # Every endpoint lives under /inventoco-api (same path the gateway routes)
  servlet:
    context-path: /inventoco-api
  forward-headers-strategy: framework

spring:
  application:
    name: inventoco
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/inventoco}
    username: ${USER_DB:inventoco}
    password: ${PASSWORD_DB:mysecretpassword}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  devtools:
    restart:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        # /actuator/health/liveness and /actuator/health/readiness
        enabled: true
      group:
        readiness:
          include: readinessState,db

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

inventoco:
  # authco: public issuer (iss claim), internal URL (JWKS, userinfo) and inventoco audience.
  # The MCP endpoint (<resource-id>/mcp) shares this audience.
  security:
    issuer: ${AUTHCO_ISSUER:http://localhost:8087/authco}
    internal-url: ${AUTHCO_INTERNAL_URL:${inventoco.security.issuer}}
    resource-id: ${INVENTOCO_RESOURCE_ID:http://localhost:8095/inventoco-api}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4500}
  # Store-chain prices of Colombia for the shared catalog (see IngestJob). Off by default.
  ingest:
    enabled: ${INGEST_ENABLED:false}
    on-start: ${INGEST_ON_START:false}
    cron: ${INGEST_CRON:0 30 5 * * *}
    per-term: ${INGEST_PER_TERM:500}
    pause: ${INGEST_PAUSE:PT1.5S}
    d1:
      url: https://www.d1.com.co
      terms: /despensa,/frutas-y-verduras,/lacteos-y-huevos,/bebidas,/pollo-carne-y-pescado,/hogar/aseo-y-limpieza,/cuidado-personal-y-belleza
    exito:
      url: https://www.exito.com
    carulla:
      url: https://www.carulla.com
    search-terms: arroz,aceite,azucar,cafe,leche,huevos,panela,frijol,lenteja,pasta,harina,sal,atun,chocolate,mantequilla,queso,detergente,jabon,papel higienico,suavizante,lavaloza
    agrofruver:
      url: https://aebyskaumhwkuelbxviv.supabase.co/functions/v1/inventario
